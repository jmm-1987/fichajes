<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1b3a5c">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Fichaje">
  <title>{% block titulo %}Fichaje{% endblock %}</title>
  <link rel="manifest" href="{{ url_for('fichaje_publico_bp.manifest') }}">
  <link rel="apple-touch-icon" href="{{ url_for('static', filename='img/logo-jm.png') }}">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
  <style>
    .kiosk-wrap { min-height: 70vh; }
    .kiosk-input-codigo { font-size: 1.5rem; letter-spacing: 0.05em; }
    .kiosk-titulo { font-weight: 600; }
  </style>
</head>
<body class="cuerpo-app bg-light">
  <div class="d-flex justify-content-between align-items-center py-2 px-3 border-bottom bg-white">
    <span class="text-azul-oscuro fw-semibold">Control horario</span>
    <span class="small text-muted">Terminal</span>
  </div>
  <div class="container kiosk-wrap py-4 px-3">
    {% include 'componentes/_mensajes.html' %}
    {% block contenido %}{% endblock %}
  </div>
  <div class="container pb-4 text-center" style="margin-top: -90px;">
    <img src="{{ url_for('fichaje_publico_bp.logo_alditraex') }}"
         alt="Alditraex"
         style="max-width: 320px; height: auto;">
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", function () {
        navigator.serviceWorker.register("{{ url_for('fichaje_publico_bp.service_worker') }}", {
          scope: "{{ url_for('fichaje_publico_bp.inicio') }}"
        });
      });
    }
  </script>
  {% block scripts_extra %}{% endblock %}
</body>
</html>
