<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1b3a5c">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Fichaje">
  <title>{% block titulo %}Fichaje{% endblock %}</title>
  <link rel="manifest" href="{{ url_for('.manifest') }}">
  <link rel="apple-touch-icon" href="{{ url_for('static', filename='img/logo-jm.png') }}">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
  <style>
    .kiosk-shell { min-height: 100vh; display: flex; flex-direction: column; }
    .kiosk-main { flex: 1 0 auto; position: relative; z-index: 2; padding-bottom: 1.5rem; }
    .kiosk-footer {
      flex-shrink: 0;
      position: relative;
      z-index: 1;
      padding: 1.25rem 1rem 1.5rem;
      border-top: 1px solid #dee2e6;
      background: #fff;
    }
    .kiosk-logo { max-width: min(280px, 88vw); height: auto; display: block; margin: 0 auto; }
    .kiosk-input-codigo { font-size: 1.5rem; letter-spacing: 0.05em; }
    .kiosk-titulo { font-weight: 600; }
    .kiosk-form-card { position: relative; z-index: 5; }
    #bloque-hora-manual { position: relative; z-index: 20; }
    #bloque-hora-manual input[type="time"] { position: relative; z-index: 21; }
  </style>
</head>
<body class="cuerpo-app bg-light kiosk-shell">
  <div class="d-flex justify-content-between align-items-center py-2 px-3 border-bottom bg-white">
    <span class="text-azul-oscuro fw-semibold">Control horario</span>
    <span class="small text-muted">Terminal</span>
  </div>
  <main class="container kiosk-main py-4 px-3">
    {% include 'componentes/_mensajes.html' %}
    {% block contenido %}{% endblock %}
  </main>
  <footer class="kiosk-footer text-center">
    <img src="{{ url_for('.logo') }}"
         alt="{{ kiosk_logo_alt }}"
         class="kiosk-logo">
  </footer>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", function () {
        navigator.serviceWorker.register("{{ url_for('.service_worker') }}", {
          scope: "{{ url_for('.inicio') }}"
        });
      });
    }
  </script>
  {% block scripts_extra %}{% endblock %}
</body>
</html>
