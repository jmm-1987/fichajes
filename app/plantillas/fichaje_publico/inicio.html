{% extends 'fichaje_publico/kiosk_base.html' %}
{% block titulo %}Fichaje con código{% endblock %}
{% block contenido %}
<div class="mx-auto" style="max-width: 520px;">
  <h1 class="h3 kiosk-titulo text-azul-oscuro text-center mb-2">Control registro horarios</h1>
  <p class="text-muted text-center small mb-4">
   
  </p>
  <form method="post" action="{{ url_for('.inicio') }}" autocomplete="off" class="card border-0 shadow-sm kiosk-form-card">
    <div class="card-body p-4">
      <label for="codigo" class="form-label">Introduzca su código de empleado</label>
      <input type="text" name="codigo" id="codigo" class="form-control form-control-lg kiosk-input-codigo text-center font-monospace"
             inputmode="text" autofocus required>
      <p class="small text-muted mt-2 mb-0">Si se le pasó la hora, podrá indicarla en el siguiente paso.</p>
      <button type="submit" class="btn btn-acento btn-lg w-100 mt-4 py-3">Continuar</button>
    </div>
  </form>
</div>
{% endblock %}
