<div class="border rounded-3 p-3 mt-3 bg-light">
  <div class="form-check">
    <input class="form-check-input" type="checkbox" name="usar_hora_manual" value="1" id="usar_hora_manual"
           {% if usar_hora_manual_checked %}checked{% endif %}>
    <label class="form-check-label" for="usar_hora_manual">
      Indicar otra hora <span class="text-muted">(si se me pasó)</span>
    </label>
  </div>
  <div id="bloque-hora-manual" class="mt-3{% if not usar_hora_manual_checked %} d-none{% endif %}">
    <label for="hora_manual" class="form-label small mb-1">Hora de hoy</label>
    <input type="time" name="hora_manual" id="hora_manual" class="form-control form-control-lg text-center font-monospace"
           value="{{ hora_default }}" required>
    <p class="small text-muted mb-0 mt-2">Se registrará esa hora como fichaje efectivo.</p>
  </div>
</div>
<script>
(function () {
  var chk = document.getElementById('usar_hora_manual');
  var bloque = document.getElementById('bloque-hora-manual');
  var input = document.getElementById('hora_manual');
  if (!chk || !bloque || !input) return;
  function sync() {
    if (chk.checked) {
      bloque.classList.remove('d-none');
      input.required = true;
    } else {
      bloque.classList.add('d-none');
      input.required = false;
    }
  }
  chk.addEventListener('change', sync);
  sync();
})();
</script>
