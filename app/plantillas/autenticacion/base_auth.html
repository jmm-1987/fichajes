<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block titulo %}Acceso{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
</head>
<body class="cuerpo-auth d-flex align-items-center justify-content-center min-vh-100">
  <div class="w-100" style="max-width:420px">
    {% if config.get('HABILITAR_FICHAJE_PUBLICO', True) %}
    <div class="text-center mb-3 px-3">
      <img src="{{ url_for('fichaje_publico_bp.logo') }}"
           alt="{{ config.get('KIOSK_LOGO_ALT', 'Empresa') }}"
           style="max-width:min(240px,80vw);height:auto;">
    </div>
    {% endif %}
    {% include 'componentes/_mensajes.html' %}
    {% block contenido %}{% endblock %}
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
